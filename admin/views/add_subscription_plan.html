<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repvio | Add subscription plan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#C6FF00',
                        secondary: '#00E5FF',
                        tertiary: '#D9EFFF',
                        neutral: '#0A0A0A'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');
        body { font-family: 'Outfit', sans-serif; }
        .form-input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            border-radius: 12px;
            padding: 12px 16px;
            outline: none;
        }
        .form-input:focus { border-color: #C6FF00; box-shadow: 0 0 15px rgba(198, 255, 0, 0.1); }
        label { display: block; font-size: 0.875rem; color: #64748b; margin-bottom: 0.5rem; font-weight: 500; }
        .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; color: var(--text-main); display: flex; align-items: center; }
        .section-title i { margin-right: 0.75rem; color: #C6FF00; }
        .setup-option {
            border: 1px solid var(--border-main);
            border-radius: 12px;
            padding: 14px 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .setup-option:hover { border-color: rgba(198, 255, 0, 0.35); }
        .setup-option--selected {
            border-color: #C6FF00;
            background: rgba(198, 255, 0, 0.06);
        }
        .setup-option input { accent-color: #C6FF00; }
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px;
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            border-radius: 12px;
            min-height: 48px;
        }
        .tag-pill {
            background: rgba(198, 255, 0, 0.2);
            color: var(--text-main);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tag-pill button { opacity: 0.7; }
        .tag-pill button:hover { opacity: 1; color: #f87171; }
        #tag-input-field {
            flex: 1;
            min-width: 120px;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
        }
        #store-fields.disabled-block { opacity: 0.45; pointer-events: none; }
    </style>
</head>
<body class="min-h-screen flex">

    <div id="sidebar-container"></div>

    <main class="flex-1 p-8 overflow-y-auto">
        <div id="header-container"></div>

        <div class="max-w-3xl mx-auto">
            <div class="flex items-center space-x-4 mb-8">
                <a href="/subscription-plans" class="text-gray-500 hover:text-primary transition-all">
                    <i class="fas fa-arrow-left text-xl"></i>
                </a>
                <div>
                    <h2 class="text-3xl font-bold">Add subscription plan</h2>
                    <p class="text-gray-500 text-sm">Manual IDs or auto-create on Google Play / App Store (requires .env credentials).</p>
                </div>
            </div>

            <form id="planForm" class="space-y-8">
                <div class="bg-[var(--bg-sidebar)] border border-[var(--border-main)] rounded-2xl p-8">
                    <h3 class="section-title"><i class="fas fa-sliders-h"></i> Setup mode</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <label class="setup-option setup-option--selected" id="opt-manual">
                            <input type="radio" name="setup_mode" value="manual" checked class="mr-2">
                            <span class="font-semibold block">Add manually</span>
                            <span class="text-xs text-gray-500">Enter Play / App Store product IDs yourself</span>
                        </label>
                        <label class="setup-option" id="opt-auto">
                            <input type="radio" name="setup_mode" value="auto" class="mr-2">
                            <span class="font-semibold block">Auto-create on stores</span>
                            <span class="text-xs text-gray-500">Creates products via Play &amp; App Store APIs</span>
                        </label>
                    </div>
                </div>

                <div id="store-status-banner" class="hidden mb-2 rounded-xl border border-[var(--border-main)] bg-[var(--bg-input)] p-4 text-sm text-gray-400"></div>

                <div id="auto-fields" class="hidden bg-[var(--bg-sidebar)] border border-[var(--border-main)] rounded-2xl p-8 space-y-4">
                    <h3 class="section-title"><i class="fas fa-magic"></i> Auto-create options</h3>
                    <div>
                        <label for="product_id">Product ID slug (optional)</label>
                        <input type="text" id="product_id" class="form-input font-mono text-sm" placeholder="e.g. pro_monthly (auto from name if empty)">
                        <p class="text-[10px] text-gray-500 mt-2">Google: lowercase_with_underscores · Apple: prefix + slug from .env</p>
                    </div>
                    <div>
                        <label for="billing_period">Billing period</label>
                        <select id="billing_period" class="form-input">
                            <option value="P1W">Weekly (P1W)</option>
                            <option value="P1M" selected>Monthly (P1M)</option>
                            <option value="P3M">3 months (P3M)</option>
                            <option value="P6M">6 months (P6M)</option>
                            <option value="P1Y">Yearly (P1Y)</option>
                        </select>
                    </div>
                </div>

                <div class="bg-[var(--bg-sidebar)] border border-[var(--border-main)] rounded-2xl p-8 space-y-4">
                    <h3 class="section-title"><i class="fas fa-credit-card"></i> Plan details</h3>
                    <div>
                        <label for="name">Name *</label>
                        <input type="text" id="name" class="form-input" required maxlength="120" placeholder="e.g. Pro Monthly">
                    </div>
                    <div>
                        <label for="description">Description</label>
                        <textarea id="description" rows="3" class="form-input" placeholder="What users get with this plan"></textarea>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="status">Status</label>
                            <select id="status" class="form-input">
                                <option value="draft">Draft</option>
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                                <option value="archived">Archived</option>
                            </select>
                        </div>
                        <div>
                            <label for="free_trials">Free trial (days)</label>
                            <input type="number" id="free_trials" class="form-input" min="0" value="0">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="price">Price *</label>
                            <input type="number" id="price" class="form-input" min="0" step="0.01" value="0" required>
                        </div>
                        <div>
                            <label for="currency">Currency</label>
                            <input type="text" id="currency" class="form-input" maxlength="3" value="USD" placeholder="USD">
                        </div>
                    </div>
                    <div>
                        <label>Features</label>
                        <div class="tags-container" id="tags-container">
                            <input type="text" id="tag-input-field" placeholder="Type feature and press Enter">
                        </div>
                        <p class="text-[10px] text-gray-500 mt-2">Press Enter to add each feature.</p>
                    </div>
                </div>

                <div id="store-fields" class="bg-[var(--bg-sidebar)] border border-[var(--border-main)] rounded-2xl p-8 space-y-4">
                    <h3 class="section-title"><i class="fas fa-store"></i> Store product IDs</h3>
                    <div>
                        <label for="play_store_sub_id">Google Play subscription ID</label>
                        <input type="text" id="play_store_sub_id" class="form-input font-mono text-sm" placeholder="e.g. pro_monthly">
                    </div>
                    <div>
                        <label for="app_store_sub_id">App Store subscription ID</label>
                        <input type="text" id="app_store_sub_id" class="form-input font-mono text-sm" placeholder="e.g. com.repvio.pro.monthly">
                    </div>
                </div>

                <div class="flex justify-end gap-4">
                    <a href="/subscription-plans" class="bg-[var(--bg-input)] hover:opacity-80 text-[var(--text-main)] px-8 py-3 rounded-xl font-semibold">Cancel</a>
                    <button type="submit" id="submitBtn" class="bg-primary hover:scale-[1.02] text-black font-bold px-10 py-3 rounded-xl">
                        Create plan
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script src="/js/layout.js"></script>
    <script>
        const featureTags = [];

        function authHeaders() {
            return {
                'Content-Type': 'application/json',
                Authorization: 'Bearer ' + (localStorage.getItem('adminToken') || '')
            };
        }

        document.getElementById('tag-input-field').addEventListener('keydown', function (e) {
            if (e.key !== 'Enter') return;
            e.preventDefault();
            const v = this.value.trim();
            if (!v || featureTags.includes(v)) return;
            featureTags.push(v);
            this.value = '';
            renderTags();
        });

        function renderTags() {
            const container = document.getElementById('tags-container');
            const input = document.getElementById('tag-input-field');
            container.querySelectorAll('.tag-pill').forEach((el) => el.remove());
            featureTags.forEach((tag, i) => {
                const pill = document.createElement('span');
                pill.className = 'tag-pill';
                pill.innerHTML = escapeHtml(tag) + ' <button type="button" aria-label="Remove">&times;</button>';
                pill.querySelector('button').onclick = () => {
                    featureTags.splice(i, 1);
                    renderTags();
                };
                container.insertBefore(pill, input);
            });
        }

        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function syncSetupMode() {
            const mode = document.querySelector('input[name="setup_mode"]:checked')?.value || 'manual';
            const isAuto = mode === 'auto';
            document.getElementById('opt-manual').classList.toggle('setup-option--selected', !isAuto);
            document.getElementById('opt-auto').classList.toggle('setup-option--selected', isAuto);
            document.getElementById('store-fields').classList.toggle('hidden', isAuto);
            document.getElementById('auto-fields').classList.toggle('hidden', !isAuto);
        }

        document.querySelectorAll('input[name="setup_mode"]').forEach((radio) => {
            radio.addEventListener('change', syncSetupMode);
        });

        async function loadStoreStatus() {
            const banner = document.getElementById('store-status-banner');
            try {
                const res = await fetch('/api/admin/subscription-plans/store-status', {
                    headers: { Authorization: 'Bearer ' + (localStorage.getItem('adminToken') || '') }
                });
                const json = await res.json().catch(() => ({}));
                if (!res.ok) return;
                const g = json.data?.googlePlay;
                const a = json.data?.appleAppStore;
                const parts = [];
                parts.push('Google Play: ' + (g?.configured ? 'ready (' + (g.packageName || '') + ')' : 'not configured'));
                parts.push('App Store: ' + (a?.configured ? 'ready' : 'not configured'));
                banner.textContent = parts.join(' · ');
                banner.classList.remove('hidden');
                if (!g?.configured && !a?.configured) {
                    banner.classList.add('border-amber-500/40', 'text-amber-200/90');
                }
            } catch {
                /* ignore */
            }
        }

        loadStoreStatus();
        syncSetupMode();

        document.getElementById('planForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const setup = document.querySelector('input[name="setup_mode"]:checked')?.value || 'manual';
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Creating...';

            const payload = {
                setup_mode: setup,
                name: document.getElementById('name').value.trim(),
                description: document.getElementById('description').value.trim(),
                status: document.getElementById('status').value,
                free_trials: document.getElementById('free_trials').value,
                price: document.getElementById('price').value,
                currency: document.getElementById('currency').value.trim(),
                features: featureTags,
                play_store_sub_id: document.getElementById('play_store_sub_id').value.trim(),
                app_store_sub_id: document.getElementById('app_store_sub_id').value.trim()
            };
            if (setup === 'auto') {
                payload.product_id = document.getElementById('product_id').value.trim();
                payload.billing_period = document.getElementById('billing_period').value;
            }

            try {
                const res = await fetch('/api/admin/subscription-plans', {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify(payload)
                });
                const json = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(json.message || 'Failed to create plan');

                let msg = json.message || 'Plan saved.';
                if (json.warnings?.length) msg += '\n\n' + json.warnings.join('\n');
                if (json.stores?.googlePlay?.productId) {
                    msg += '\n\nPlay ID: ' + json.stores.googlePlay.productId;
                }
                if (json.stores?.appleAppStore?.productId) {
                    msg += '\nApp Store ID: ' + json.stores.appleAppStore.productId;
                }
                await Swal.fire({
                    icon: 'success',
                    title: 'Plan created',
                    text: msg,
                    background: 'var(--bg-sidebar)',
                    color: 'var(--text-main)',
                    confirmButtonColor: '#C6FF00'
                });
                window.location.href = '/subscription-plans';
            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: err.message,
                    background: 'var(--bg-sidebar)',
                    color: 'var(--text-main)'
                });
                btn.disabled = false;
                btn.textContent = 'Create plan';
            }
        });
    </script>
</body>
</html>
