<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repvio | Challenges</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
        }

        /* Custom DataTables Styling */
        .dataTables_wrapper {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-main);
            border-radius: 16px;
            padding: 20px;
        }
        .dataTables_wrapper .dataTables_length, 
        .dataTables_wrapper .dataTables_filter, 
        .dataTables_wrapper .dataTables_info, 
        .dataTables_wrapper .dataTables_processing, 
        .dataTables_wrapper .dataTables_paginate {
            color: var(--text-muted) !important;
            margin-bottom: 15px;
        }
        .dataTables_wrapper .dataTables_filter input {
            background: var(--bg-input) !important;
            border: 1px solid var(--border-main) !important;
            color: var(--text-main) !important;
            border-radius: 8px !important;
            padding: 6px 12px !important;
            margin-left: 10px;
        }
        table.dataTable {
            border-collapse: collapse !important;
            width: 100% !important;
        }
        table.dataTable thead th {
            border-bottom: 1px solid var(--border-main) !important;
            color: var(--text-muted) !important;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            padding: 12px 10px !important;
        }
        table.dataTable tbody td {
            border-bottom: 1px solid var(--border-main) !important;
            padding: 14px 10px !important;
            font-size: 0.9rem;
            background: transparent !important;
        }
        table.dataTable tbody tr:hover td {
            background: var(--bg-input) !important;
        }
        .dataTables_wrapper .dataTables_paginate .paginate_button {
            border-radius: 8px !important;
            border: 1px solid var(--border-main) !important;
            background: var(--bg-row) !important;
            color: var(--text-muted) !important;
            padding: 8px 15px !important;
            margin: 0 5px !important;
            transition: all 0.2s ease;
        }
        .dataTables_wrapper .dataTables_paginate .paginate_button.current {
            background: #C6FF00 !important;
            color: black !important;
            border-color: #C6FF00 !important;
            font-weight: bold;
        }
        .dataTables_wrapper .dataTables_paginate .paginate_button:hover:not(.current) {
            background: var(--bg-input) !important;
            color: var(--text-main) !important;
            border-color: var(--border-main) !important;
        }

        .tag-lime { background: rgba(198, 255, 0, 0.15); color: #C6FF00; }
        .tag-blue { background: rgba(0, 229, 255, 0.12); color: #00E5FF; }
        .tag-muted { background: rgba(255,255,255,0.06); color: #888; }
    </style>
</head>

<body class="min-h-screen flex">

    <div id="sidebar-container"></div>

    <main class="flex-1 p-8 overflow-y-auto">
        <div id="header-container"></div>

        <div class="flex justify-between items-center mb-6 flex-wrap gap-4">
            <h3 class="text-xl font-bold">All challenges</h3>
            <a href="/admin/challenges/add"
                class="bg-gradient-to-r from-primary to-secondary hover:opacity-90 text-black font-extrabold py-2 px-6 rounded-lg transition-all shadow-[0_0_20px_rgba(198,255,0,0.3)]">
                <i class="fas fa-plus mr-2"></i> Create challenge
            </a>
        </div>

        <div class="mt-4">
            <table id="challengesTable" class="w-full text-left">
                <thead>
                    <tr>
                        <th>Name & Tags</th>
                        <th>Status</th>
                        <th>Duration</th>
                        <th>Fee</th>
                        <th>Top 1 Reward</th>
                        <th>Starts</th>
                        <th>Ends</th>
                        <th>Days</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </main>

    <!-- Layout Script -->
    <script>
    (function (g) {
        var p = g.location.pathname, i = p.indexOf('/admin'), b = i >= 0 ? p.slice(0, i) : '';
        try { if (b) g.sessionStorage.setItem('repvioAppBase', b); else g.sessionStorage.removeItem('repvioAppBase'); } catch (e) {}
        g.__APP_BASE_PATH__ = b;
        document.write('<script src="' + b + '/js/admin-paths.js"><\/script><script src="' + b + '/js/layout.js"><\/script>');
    })(window);
    </script>

    <script>
        let dataTable;

        function fmtDate(v) {
            if (!v) return '—';
            return new Date(v).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
        }

        function escapeHtml(s) {
            if (s == null || s === '') return '';
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function parseStoredTags(raw) {
            if (!raw) return [];
            if (Array.isArray(raw)) return raw.map(String).filter(Boolean);
            if (typeof raw === 'string') {
                try {
                    const p = JSON.parse(raw);
                    if (Array.isArray(p)) return p.map(String).filter(Boolean);
                    return raw.split(',').map((s) => s.trim()).filter(Boolean);
                } catch {
                    return raw.split(',').map((s) => s.trim()).filter(Boolean);
                }
            }
            return [];
        }

        function statusTag(status) {
            const map = {
                draft: 'tag-muted',
                published: 'tag-lime',
                archived: 'tag-blue'
            };
            const cls = map[status] || 'tag-muted';
            return `<span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase ${cls}">${status}</span>`;
        }

        $.fn.dataTable.ext.errMode = 'none';

        function initTable() {
            if ($.fn.DataTable.isDataTable('#challengesTable')) {
                $('#challengesTable').DataTable().destroy();
            }

            dataTable = $('#challengesTable').DataTable({
                ajax: {
                    url: '/api/admin/challenges',
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem('adminToken')
                    },
                    dataSrc: 'data',
                    error: function (xhr) {
                        if (xhr.status === 401 || xhr.status === 403) {
                            localStorage.removeItem('adminToken');
                            window.location.href = typeof adminUrl === 'function' ? adminUrl('/login') : '/admin/login';
                        }
                    }
                },
                columns: [
                    {
                        data: 'name',
                        className: 'font-semibold',
                        render: (d, _, row) => {
                            const tags = parseStoredTags(row.tags);
                            let tagHtml = '';
                            if (tags.length) {
                                tagHtml = '<div class="flex flex-wrap gap-1 mt-1">' +
                                    tags.map(t => `<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-primary/15 text-primary border border-primary/30">${escapeHtml(t)}</span>`).join('') +
                                    '</div>';
                            }
                            return `<div>${escapeHtml(d)}${tagHtml}</div>`;
                        }
                    },
                    {
                        data: 'status',
                        render: (d) => statusTag(d)
                    },
                    {
                        data: 'total_days',
                        render: (d) => `<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-purple-500/15 text-purple-400 border border-purple-500/30 font-mono">${d ?? 1} Days</span>`
                    },
                    {
                        data: 'joining_fee',
                        render: (d) => parseFloat(d) > 0 ? `<span class="font-mono text-blue-400 font-semibold">$${parseFloat(d).toFixed(2)}</span>` : '<span class="text-gray-500 text-xs uppercase font-semibold">Free</span>'
                    },
                    {
                        data: 'reward',
                        render: (d) => parseFloat(d) > 0 ? `<span class="font-mono text-amber-400 font-semibold">$${parseFloat(d).toFixed(2)}</span>` : '<span class="text-gray-500 text-xs">—</span>'
                    },
                    { data: 'starts_at', render: (d) => fmtDate(d) },
                    { data: 'ends_at', render: (d) => fmtDate(d) },
                    {
                        data: 'stage_count',
                        render: (d) => `<span class="font-mono text-sm">${d ?? 0}</span>`
                    },
                    {
                        data: null,
                        orderable: false,
                        searchable: false,
                        className: 'text-right',
                        render: (_, __, row) => `
                            <div class="flex items-center justify-end space-x-2">
                                <a href="/admin/challenges/view/${row.id}" class="text-gray-500 hover:text-primary p-2 bg-[var(--bg-input)] rounded-lg" title="View"><i class="fas fa-eye"></i></a>
                                <a href="/admin/challenges/edit/${row.id}" class="text-gray-500 hover:text-primary p-2 bg-[var(--bg-input)] rounded-lg" title="Edit"><i class="fas fa-edit"></i></a>
                                <button type="button" onclick="deleteChallenge('${row.id}')" class="text-gray-500 hover:text-red-500 p-2 bg-[var(--bg-input)] rounded-lg" title="Delete"><i class="fas fa-trash"></i></button>
                            </div>
                        `
                    }
                ],
                order: [[5, 'desc']],
                pageLength: 10,
                language: {
                    search: '_INPUT_',
                    searchPlaceholder: 'Search challenges...',
                    emptyTable: 'No challenges yet.'
                }
            });
        }

        $(document).ready(function () {
            initTable();
        });

        async function deleteChallenge(id) {
            const result = await Swal.fire({
                title: 'Delete this challenge?',
                text: 'This removes stages, linked exercises, and user progress for this challenge.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#C6FF00',
                cancelButtonColor: '#333',
                confirmButtonText: 'Yes, delete',
                background: 'var(--bg-sidebar)',
                color: 'var(--text-main)'
            });
            if (!result.isConfirmed) return;
            try {
                const res = await fetch('/api/admin/challenges/' + id, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('adminToken') }
                });
                const json = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(json.message || 'Delete failed');
                Swal.fire({ title: 'Deleted', icon: 'success', timer: 1500, showConfirmButton: false, background: 'var(--bg-sidebar)', color: 'var(--text-main)' });
                dataTable.ajax.reload();
            } catch (e) {
                Swal.fire({ title: 'Error', text: e.message, icon: 'error', background: 'var(--bg-sidebar)', color: 'var(--text-main)' });
            }
        }
    </script>
</body>

</html>
