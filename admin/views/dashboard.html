<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repvio | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#C6FF00',
                        secondary: '#00E5FF',
                        tertiary: '#D9EFFF',
                        neutral: '#0A0A0A'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');
        body { font-family: 'Outfit', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .stat-card:hover { border-color: rgba(198, 255, 0, 0.3); transform: translateY(-4px); }
    </style>
</head>
<body class="min-h-screen flex">

    <!-- Sidebar Container -->
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <main class="flex-1 p-8 overflow-y-auto">
        <!-- Header Container -->
        <div id="header-container"></div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div class="glass-card stat-card p-6 rounded-2xl transition-all">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-gray-500 text-xs uppercase tracking-wider">Total Waitlist</p>
                        <h3 class="text-3xl font-bold mt-2 text-primary" id="totalWaitlist">0</h3>
                    </div>
                    <div class="bg-primary/10 p-2 rounded-lg text-primary text-xs"><i class="fas fa-users"></i></div>
                </div>
                <p class="text-[10px] text-green-500 mt-3 font-semibold uppercase"><i class="fas fa-trending-up mr-1"></i> Viral Spike</p>
            </div>
            
            <div class="glass-card stat-card p-6 rounded-2xl transition-all">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-gray-500 text-xs uppercase tracking-wider">Active Library</p>
                        <h3 class="text-3xl font-bold mt-2 text-secondary" id="totalExercises">0</h3>
                    </div>
                    <div class="bg-secondary/10 p-2 rounded-lg text-secondary text-xs"><i class="fas fa-dumbbell"></i></div>
                </div>
                <p class="text-[10px] text-blue-500 mt-3 font-semibold uppercase">3 New This Week</p>
            </div>

            <div class="glass-card stat-card p-6 rounded-2xl transition-all">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-gray-500 text-xs uppercase tracking-wider">Avg Form Score</p>
                        <h3 class="text-3xl font-bold mt-2 text-purple-400">84%</h3>
                    </div>
                    <div class="bg-purple-500/10 p-2 rounded-lg text-purple-400 text-xs"><i class="fas fa-check-circle"></i></div>
                </div>
                <p class="text-[10px] text-purple-400 mt-3 font-semibold uppercase">High Accuracy</p>
            </div>

            <div class="glass-card stat-card p-6 rounded-2xl transition-all">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-gray-500 text-xs uppercase tracking-wider">System Status</p>
                        <h3 class="text-3xl font-bold mt-2 text-green-400">Stable</h3>
                    </div>
                    <div class="bg-green-500/10 p-2 rounded-lg text-green-400 text-xs"><i class="fas fa-bolt"></i></div>
                </div>
                <p class="text-[10px] text-green-400 mt-3 font-semibold uppercase">Latency: 24ms</p>
            </div>
        </div>

        <!-- Charts Section -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
            <div class="lg:col-span-2 glass-card p-6 rounded-2xl">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-bold">Registration Growth</h3>
                    <div class="flex space-x-2">
                        <button class="bg-white/5 p-1 px-3 rounded text-[10px] hover:bg-primary hover:text-black transition-all">Daily</button>
                        <button class="bg-primary p-1 px-3 rounded text-[10px] text-black">Weekly</button>
                    </div>
                </div>
                <canvas id="growthChart" class="max-h-[300px]"></canvas>
            </div>

            <div class="glass-card p-6 rounded-2xl">
                <h3 class="text-lg font-bold mb-6">User Distribution</h3>
                <canvas id="distChart" class="max-h-[300px]"></canvas>
            </div>
        </div>

        <!-- Recent Activity Table -->
        <div class="glass-card rounded-2xl overflow-hidden">
            <div class="p-6 border-b border-gray-800 flex justify-between items-center">
                <h3 class="text-lg font-bold">Recent user registrations</h3>
                <a href="/users" class="text-xs text-secondary hover:underline">View all</a>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-primary/5 text-[10px] uppercase tracking-widest text-gray-500">
                        <tr>
                            <th class="p-4">User Email</th>
                            <th class="p-4">Role</th>
                            <th class="p-4">Status</th>
                            <th class="p-4">Joined At</th>
                        </tr>
                    </thead>
                    <tbody id="recentUsersTable" class="text-sm divide-y divide-gray-800/50">
                        <!-- Dynamic Data -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Layout Script -->
    <script src="/js/layout.js"></script>
    <script>
        const adminAuthHeaders = () => ({
            Authorization: 'Bearer ' + (localStorage.getItem('adminToken') || '')
        });

        async function initDashboard() {
            try {
                // Fetch Stats (public)
                const stats = await fetch('/api/waitlist/stats').then((r) => r.json());
                document.getElementById('totalWaitlist').innerText = stats.count ?? 0;

                const exercises = await fetch('/api/exercises').then((r) => r.json());
                document.getElementById('totalExercises').innerText = exercises.count ?? 0;

                // Growth (admin-protected)
                const growthRes = await fetch('/api/waitlist/analytics/growth', {
                    headers: adminAuthHeaders()
                });
                const growthJson = await growthRes.json().catch(() => ({}));
                const growthData = Array.isArray(growthJson.data) ? growthJson.data : [];

                const growthLabels = growthData.map((item) => {
                    const date = new Date(item.date);
                    return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                });
                const growthCounts = growthData.map((item) => item.count);

                const ctx = document.getElementById('growthChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: growthLabels.length ? growthLabels : ['No Data'],
                        datasets: [{
                            label: 'New Signups',
                            data: growthCounts.length ? growthCounts : [0],
                            borderColor: '#C6FF00',
                            backgroundColor: 'rgba(198, 255, 0, 0.1)',
                            fill: true,
                            tension: 0.4,
                            borderWidth: 3,
                            pointRadius: 4,
                            pointBackgroundColor: '#C6FF00'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { grid: { color: 'rgba(0,0,0,0.05)' }, ticks: { color: '#999' }, beginAtZero: true },
                            x: { grid: { display: false }, ticks: { color: '#999' } }
                        }
                    }
                });

                // Distribution Chart
                const distCtx = document.getElementById('distChart').getContext('2d');
                new Chart(distCtx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Train', 'Play', 'Recover'],
                        datasets: [{
                            data: [65, 25, 10],
                            backgroundColor: ['#C6FF00', '#00E5FF', '#D9EFFF'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { position: 'bottom', labels: { color: '#888', usePointStyle: true } } },
                        cutout: '70%'
                    }
                });

                const table = document.getElementById('recentUsersTable');
                const usersRes = await fetch('/api/admin/users', { headers: adminAuthHeaders() });
                const usersJson = await usersRes.json().catch(() => ({}));
                const users = Array.isArray(usersJson.data) ? usersJson.data : [];

                function escapeCell(s) {
                    if (s == null) return '';
                    const d = document.createElement('div');
                    d.textContent = String(s);
                    return d.innerHTML;
                }

                if (users.length > 0) {
                    table.innerHTML = users
                        .slice(0, 5)
                        .map((u) => {
                            const role = escapeCell(u.role || 'user');
                            const status = escapeCell(u.status || 'active');
                            const email = escapeCell(u.email || '');
                            const joined =
                                u.createdAt != null
                                    ? escapeCell(new Date(u.createdAt).toLocaleString())
                                    : '—';
                            const statusClass =
                                (u.status || '') === 'active'
                                    ? 'border-emerald-500/40 text-emerald-500'
                                    : (u.status || '') === 'suspended'
                                      ? 'border-red-500/40 text-red-400'
                                      : (u.status || '') === 'inactive'
                                        ? 'border-amber-500/40 text-amber-400'
                                        : 'border-gray-600 text-gray-400';
                            return `
                        <tr class="hover:bg-primary/5 transition-all">
                            <td class="p-4 font-medium">${email}</td>
                            <td class="p-4"><span class="text-[10px] px-2 py-0.5 rounded-full border border-gray-600 text-gray-400 font-mono uppercase">${role}</span></td>
                            <td class="p-4"><span class="text-[10px] px-2 py-0.5 rounded-full border capitalize ${statusClass}">${status}</span></td>
                            <td class="p-4 text-gray-500">${joined}</td>
                        </tr>
                    `;
                        })
                        .join('');
                } else {
                    table.innerHTML =
                        '<tr><td colspan="4" class="p-8 text-center text-gray-600">No registered users yet.</td></tr>';
                }

            } catch (err) {
                console.error('Dashboard Init Failed:', err);
            }
        }
        initDashboard();
    </script>
</body>
</html>
