<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repvio | Edit training mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#C6FF00',
                        secondary: '#00E5FF',
                        tertiary: '#D9EFFF',
                        neutral: '#0A0A0A'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');
        body { font-family: 'Outfit', sans-serif; }
        .form-input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            border-radius: 12px;
            padding: 12px 16px;
            outline: none;
            transition: all 0.3s ease;
        }
        .form-input:focus { border-color: #C6FF00; box-shadow: 0 0 15px rgba(198, 255, 0, 0.1); }
        label { display: block; font-size: 0.875rem; color: #64748b; margin-bottom: 0.5rem; font-weight: 500; }
        .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; color: var(--text-main); display: flex; align-items: center; }
        .section-title i { margin-right: 0.75rem; color: #C6FF00; }
        .exercise-ts .ts-control {
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            border-radius: 12px;
            color: var(--text-main);
            min-height: 52px;
            padding: 8px 12px;
        }
        .exercise-ts .ts-control.focus { border-color: #C6FF00; box-shadow: 0 0 15px rgba(198, 255, 0, 0.1); }
        .exercise-ts .ts-dropdown,
        .ts-dropdown {
            z-index: 10050;
            background: var(--bg-sidebar);
            border: 1px solid var(--border-main);
            border-radius: 12px;
            color: var(--text-main);
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
            box-sizing: border-box;
            overflow: hidden;
        }
        .exercise-ts .ts-dropdown-content,
        .ts-dropdown-content { max-height: 16rem; padding: 0.25rem 0; }
        .exercise-ts .option, .exercise-ts .optgroup-header,
        .ts-dropdown .option, .ts-dropdown .optgroup-header { padding: 0; }
        .ts-dropdown .option {
            display: flex;
            align-items: flex-start;
            gap: 0.65rem;
            padding: 0.65rem 0.85rem !important;
            border-bottom: 1px solid var(--border-main);
        }
        .ts-dropdown .option:last-child { border-bottom: none; }
        .ts-dropdown .tomselect-checkbox {
            width: 1.05rem;
            height: 1.05rem;
            margin-top: 0.15rem;
            flex-shrink: 0;
            border-radius: 0.35rem;
            accent-color: #C6FF00;
            cursor: pointer;
        }
        .ex-opt-body { min-width: 0; flex: 1; }
        .ex-opt-name { font-weight: 600; color: var(--text-main); font-size: 0.9rem; line-height: 1.25; }
        .ex-opt-meta { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.15rem; line-height: 1.35; }
        .exercise-ts .option.active,
        .ts-dropdown .option.active { background: rgba(198, 255, 0, 0.1); }
        .exercise-ts .item { background: rgba(198, 255, 0, 0.2); color: var(--text-main); border-radius: 8px; }
        .exercise-ts.plugin-remove_button .item .remove { border-color: var(--border-main); color: var(--text-muted); }
        .exercise-ts input::placeholder { color: var(--text-muted); }
    </style>
</head>

<body class="min-h-screen flex">
    <div id="sidebar-container"></div>

    <main class="flex-1 p-8 overflow-y-auto">
        <div id="header-container"></div>

        <div class="max-w-4xl mx-auto">
            <div class="flex items-center space-x-4 mb-8">
                <a href="/admin/training-modes" class="text-gray-500 hover:text-primary transition-all">
                    <i class="fas fa-arrow-left text-xl"></i>
                </a>
                <div>
                    <h2 class="text-3xl font-bold">Edit training mode</h2>
                    <p class="text-gray-500 text-sm">Update details and which exercises use this mode.</p>
                </div>
            </div>

            <form id="modeForm" class="space-y-8 hidden">
                <div class="bg-[var(--bg-sidebar)] border border-[var(--border-main)] rounded-2xl p-8">
                    <h3 class="section-title"><i class="fas fa-layer-group"></i> Details</h3>
                    <div class="space-y-4">
                        <div>
                            <label for="slug">Slug</label>
                            <input type="text" id="slug" class="form-input" required autocomplete="off" pattern="[a-z][a-z0-9_]*">
                        </div>
                        <div>
                            <label for="display_name">Display name</label>
                            <input type="text" id="display_name" class="form-input" required>
                        </div>
                        <div>
                            <label for="description">Description</label>
                            <textarea id="description" rows="3" class="form-input" maxlength="500"></textarea>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label for="sort_order">Sort order</label>
                                <input type="number" id="sort_order" class="form-input" min="0">
                            </div>
                            <div class="flex items-center gap-3 pt-8">
                                <input type="checkbox" id="is_active" class="w-4 h-4 accent-primary rounded">
                                <label for="is_active" class="!mb-0 cursor-pointer">Active</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-[var(--bg-sidebar)] border border-[var(--border-main)] rounded-2xl p-8">
                    <h3 class="section-title"><i class="fas fa-dumbbell"></i> Linked exercises</h3>
                    <p class="text-xs text-gray-500 mb-3">Type to search, tick several exercises; selected names show as tags above.</p>
                    <div id="exercise-multiselect-wrap" class="exercise-ts relative border border-[var(--border-main)] rounded-xl p-3 bg-[var(--bg-input)]/30 w-full">
                        <p id="exercise-load-msg" class="text-sm text-gray-500">Loading…</p>
                        <select id="exercise-multiselect" multiple autocomplete="off"></select>
                    </div>
                </div>

                <div class="flex justify-end gap-3">
                    <a href="/admin/training-modes" class="px-6 py-3 rounded-xl border border-gray-700 text-gray-400 hover:text-white">Cancel</a>
                    <button type="submit" id="submitBtn" class="px-8 py-3 rounded-xl bg-gradient-to-r from-primary to-secondary text-black font-extrabold shadow-[0_0_20px_rgba(198,255,0,0.25)]">Update mode</button>
                </div>
            </form>

            <div id="load-err" class="text-red-400 hidden"></div>
        </div>
    </main>

    <script src="/js/layout.js"></script>
    <script>
        const MODE_ID = window.location.pathname.split('/').pop();

        let exerciseTomSelect = null;

        function syncExerciseDropdownWidth(ts) {
            if (!ts || !ts.dropdown || !ts.wrapper) return;
            const r = ts.wrapper.getBoundingClientRect();
            const w = Math.max(260, Math.round(r.width));
            ts.dropdown.style.width = w + 'px';
            ts.dropdown.style.minWidth = w + 'px';
            if (typeof ts.positionDropdown === 'function') ts.positionDropdown();
        }

        function exerciseOptionsFromList(list) {
            return list.map((ex) => {
                const cat = String(ex.category || '').replace(/_/g, ' ');
                return {
                    id: String(ex.id),
                    name: ex.name,
                    subtitle: [ex.type, cat, ex.difficulty].filter(Boolean).join(' · ')
                };
            });
        }

        function initExerciseMultiselect(allExercises, linkedIds) {
            const msg = document.getElementById('exercise-load-msg');
            const sel = document.getElementById('exercise-multiselect');
            if (exerciseTomSelect) {
                exerciseTomSelect.destroy();
                exerciseTomSelect = null;
            }
            if (!allExercises.length) {
                msg.textContent = 'No exercises in library.';
                return;
            }
            msg.remove();
            exerciseTomSelect = new TomSelect(sel, {
                plugins: ['checkbox_options', 'remove_button'],
                dropdownParent: 'body',
                maxItems: null,
                maxOptions: null,
                valueField: 'id',
                labelField: 'name',
                searchField: ['name', 'subtitle'],
                options: exerciseOptionsFromList(allExercises),
                placeholder: 'Search exercises…',
                hideSelected: false,
                closeAfterSelect: false,
                onDropdownOpen() {
                    syncExerciseDropdownWidth(this);
                },
                render: {
                    option(data, esc) {
                        return `<div class="ex-opt-body">
                            <div class="ex-opt-name">${esc(data.name)}</div>
                            <div class="ex-opt-meta">${esc(data.subtitle)}</div>
                        </div>`;
                    },
                    item(data, esc) {
                        return `<div>${esc(data.name)}</div>`;
                    }
                }
            });
            const linked = (linkedIds || []).map(String);
            exerciseTomSelect.setValue(linked, true);
        }

        (async function load() {
            try {
                const [modeRes, exRes] = await Promise.all([
                    fetch('/api/admin/training-modes/' + MODE_ID, {
                        headers: { 'Authorization': 'Bearer ' + localStorage.getItem('adminToken') }
                    }),
                    fetch('/api/exercises')
                ]);
                const modeJson = await modeRes.json().catch(() => ({}));
                const exJson = await exRes.json().catch(() => ({}));
                if (!modeRes.ok) throw new Error(modeJson.message || 'Not found');
                const m = modeJson.data;
                const allEx = exJson.data || [];
                const linked = (m.exercises || []).map((x) => x.id);

                document.getElementById('slug').value = m.slug || '';
                document.getElementById('display_name').value = m.display_name || '';
                document.getElementById('description').value = m.description || '';
                document.getElementById('sort_order').value = m.sort_order ?? 0;
                document.getElementById('is_active').checked = m.is_active !== false;
                initExerciseMultiselect(allEx, linked);
                document.getElementById('modeForm').classList.remove('hidden');
            } catch (e) {
                const el = document.getElementById('load-err');
                el.textContent = e.message;
                el.classList.remove('hidden');
            }
        })();

        document.getElementById('modeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const exercise_ids = exerciseTomSelect ? exerciseTomSelect.getValue() : [];
            const payload = {
                slug: document.getElementById('slug').value.trim().toLowerCase(),
                display_name: document.getElementById('display_name').value.trim(),
                description: document.getElementById('description').value.trim() || null,
                sort_order: parseInt(document.getElementById('sort_order').value, 10) || 0,
                is_active: document.getElementById('is_active').checked,
                exercise_ids
            };
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> Saving…';
            try {
                const res = await fetch('/api/admin/training-modes/' + MODE_ID, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem('adminToken')
                    },
                    body: JSON.stringify(payload)
                });
                const json = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(json.message || 'Failed');
                await Swal.fire({ icon: 'success', title: 'Updated', timer: 1200, showConfirmButton: false, background: 'var(--bg-sidebar)', color: 'var(--text-main)' });
                window.location.href = '/admin/training-modes';
            } catch (err) {
                Swal.fire({ icon: 'error', title: 'Error', text: err.message, background: 'var(--bg-sidebar)', color: 'var(--text-main)' });
            } finally {
                btn.disabled = false;
                btn.textContent = 'Update mode';
            }
        });
    </script>
</body>

</html>
