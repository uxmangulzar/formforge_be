<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repvio | Edit Athlete</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#C6FF00',
                        secondary: '#00E5FF',
                        tertiary: '#D9EFFF',
                        neutral: '#0A0A0A'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');
        body { font-family: 'Outfit', sans-serif; }
        
        .form-input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            border-radius: 12px;
            padding: 12px 16px;
            outline: none;
            transition: all 0.3s ease;
        }
        .form-input:focus {
            border-color: #C6FF00;
            box-shadow: 0 0 15px rgba(198, 255, 0, 0.1);
        }
        label {
            display: block;
            font-size: 0.875rem;
            color: #64748b;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
        }
        .section-title i {
            margin-right: 0.75rem;
            color: #C6FF00;
        }
    </style>
</head>

<body class="min-h-screen flex">

    <!-- Sidebar Container -->
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <main class="flex-1 p-8 overflow-y-auto">
        <!-- Header Container -->
        <div id="header-container"></div>

        <div class="max-w-4xl mx-auto">
            <div class="flex items-center space-x-4 mb-8">
                <a id="back-link" href="/admin/users" class="text-gray-500 hover:text-primary transition-all">
                    <i class="fas fa-arrow-left text-xl"></i>
                </a>
                <div>
                    <h2 class="text-3xl font-bold">Edit Athlete Details</h2>
                    <p class="text-gray-500">Update account settings and fitness profile information.</p>
                </div>
            </div>

            <div class="space-y-6">
                <form id="editUserForm" class="space-y-6">
                    <!-- Account Section -->
                    <div class="bg-[var(--bg-sidebar)] border border-[var(--border-main)] rounded-2xl p-8 shadow-sm">
                        <h3 class="section-title"><i class="fas fa-user-shield"></i> Account Management</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label>Email Address</label>
                                <input type="email" name="email" id="email" class="form-input opacity-70" readonly>
                                <p class="text-[10px] text-gray-500 mt-1">Email cannot be changed for security.</p>
                            </div>
                            <div>
                                <label>Platform Role</label>
                                <select name="role" id="role" class="form-input">
                                    <option value="user">Athlete (User)</option>
                                    <option value="admin">Administrator</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Profile Section -->
                    <div class="bg-[var(--bg-sidebar)] border border-[var(--border-main)] rounded-2xl p-8 shadow-sm">
                        <h3 class="section-title"><i class="fas fa-id-card"></i> Personal Profile</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label>Full Name</label>
                                <input type="text" name="full_name" id="full_name" class="form-input" required>
                            </div>
                            <div>
                                <label>Age</label>
                                <input type="number" name="age" id="age" class="form-input">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                            <div>
                                <label>Fitness Level</label>
                                <select name="fitness_level" id="fitness_level" class="form-input">
                                    <option value="beginner">Beginner</option>
                                    <option value="intermediate">Intermediate</option>
                                    <option value="advanced">Advanced</option>
                                </select>
                            </div>
                            <div>
                                <label>Account Status</label>
                                <select name="status" id="status" class="form-input">
                                    <option value="active">Active</option>
                                    <option value="inactive">Inactive</option>
                                    <option value="suspended">Suspended</option>
                                </select>
                            </div>
                        </div>

                        <div class="mt-6">
                            <label>Training Goal</label>
                            <textarea name="goal" id="goal" rows="2" class="form-input" placeholder="What is the athlete trying to achieve?"></textarea>
                        </div>

                        <div class="mt-6">
                            <label>Injury History & Medical Notes</label>
                            <textarea name="injury_history" id="injury_history" rows="3" class="form-input" placeholder="Any physical limitations or past injuries..."></textarea>
                        </div>
                    </div>

                    <div class="flex justify-end space-x-4 pt-4">
                        <button type="button" onclick="window.history.back()" class="bg-[var(--bg-input)] hover:opacity-80 text-[var(--text-main)] px-8 py-3 rounded-xl font-semibold transition-all">
                            Cancel
                        </button>
                        <button type="submit" class="bg-primary hover:scale-[1.02] text-black font-bold px-10 py-3 rounded-xl transition-all shadow-lg">
                            Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

        <!-- Layout Script -->
    <script>
    (function (g) {
        var p = g.location.pathname, i = p.indexOf('/admin'), b = i >= 0 ? p.slice(0, i) : '';
        try { if (b) g.sessionStorage.setItem('repvioAppBase', b); else g.sessionStorage.removeItem('repvioAppBase'); } catch (e) {}
        g.__APP_BASE_PATH__ = b;
        document.write('<script src="' + b + '/js/admin-paths.js"><\/script><script src="' + b + '/js/layout.js"><\/script>');
    })(window);
    </script>

    <script>
        const userId = window.location.pathname.split('/').pop();

        async function fetchUserData() {
            try {
                const res = await fetch(`/api/profile/${userId}`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('adminToken')}` }
                });
                const { data } = await res.json();
                
                const profile = data;
                const user = data.user;

                // Fill Form
                document.getElementById('email').value = user.email;
                document.getElementById('role').value = user.role;
                document.getElementById('status').value = user.status;
                
                document.getElementById('full_name').value = profile.full_name || '';
                document.getElementById('age').value = profile.age || '';
                document.getElementById('fitness_level').value = profile.fitness_level;
                document.getElementById('goal').value = profile.goal || '';
                document.getElementById('injury_history').value = profile.injury_history || '';

                document.getElementById('back-link').href = adminUrl('/users/view/') + userId);

            } catch (err) {
                Swal.fire('Error', 'Failed to load athlete data.', 'error');
            }
        }

        document.getElementById('editUserForm').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const rawData = Object.fromEntries(formData);

            // We need two API calls: one for User settings (role, status) and one for Profile
            try {
                Swal.fire({ title: 'Updating...', didOpen: () => { Swal.showLoading() } });

                // 1. Update Profile
                const profileRes = await fetch(`/api/profile/${userId}`, {
                    method: 'PUT',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('adminToken')}`
                    },
                    body: JSON.stringify({
                        full_name: rawData.full_name,
                        age: rawData.age,
                        fitness_level: rawData.fitness_level,
                        goal: rawData.goal,
                        injury_history: rawData.injury_history
                    })
                });

                // 2. Update User Status/Role (We'll use the existing status route for now, but we might need a generic user update)
                // For simplicity, let's just update the status as it's already there
                const statusRes = await fetch(`/api/admin/users/${userId}/status`, {
                    method: 'PATCH',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('adminToken')}`
                    },
                    body: JSON.stringify({ status: rawData.status })
                });

                // Ideally we'd have a PATCH /api/admin/users/:id for role too
                // Let's assume the user has implemented or wants this
                
                if (profileRes.ok && statusRes.ok) {
                    Swal.fire({
                        title: 'Updated!',
                        text: 'Athlete profile has been successfully updated.',
                        icon: 'success',
                        background: 'var(--bg-sidebar)',
                        color: 'var(--text-main)',
                        confirmButtonColor: '#C6FF00'
                    }).then(() => {
                        window.location.href = adminUrl('/users/view/') + userId);
                    });
                } else {
                    throw new Error('Update failed');
                }

            } catch (err) {
                Swal.fire('Error', 'Failed to update athlete details.', 'error');
            }
        };

        $(document).ready(fetchUserData);
    </script>
</body>

</html>
