<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repvio | Exercise categories</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');
        body { font-family: 'Outfit', sans-serif; }

        .dataTables_wrapper { padding: 20px 0; }
        .dataTables_wrapper .dataTables_length,
        .dataTables_wrapper .dataTables_filter {
            display: inline-block;
            margin-bottom: 25px;
        }
        .dataTables_wrapper .dataTables_filter { float: right; }
        .dataTables_wrapper .dataTables_length select {
            background: var(--bg-input) !important;
            border: 1px solid var(--border-main) !important;
            border-radius: 8px !important;
            padding: 5px 10px !important;
            color: var(--text-main) !important;
            margin: 0 10px;
            outline: none !important;
        }
        .dataTables_wrapper .dataTables_filter input {
            background: var(--bg-input) !important;
            border: 1px solid var(--border-main) !important;
            border-radius: 10px !important;
            padding: 10px 15px !important;
            color: var(--text-main) !important;
            outline: none !important;
            width: 250px !important;
            margin-left: 15px;
        }
        .dataTables_wrapper .dataTables_filter input:focus {
            border-color: #C6FF00 !important;
            box-shadow: 0 0 15px rgba(198, 255, 0, 0.1) !important;
        }

        table.dataTable {
            border-collapse: separate !important;
            border-spacing: 0 12px !important;
            border: none !important;
            width: 100% !important;
        }
        table.dataTable thead th {
            background: transparent !important;
            border: none !important;
            color: #555 !important;
            font-size: 11px !important;
            text-transform: uppercase !important;
            letter-spacing: 1.5px !important;
            padding: 10px 20px !important;
        }
        table.dataTable tbody tr {
            background-color: var(--bg-row) !important;
            border-radius: 15px !important;
            transition: all 0.3s ease;
        }
        table.dataTable tbody tr td {
            border: none !important;
            padding: 20px !important;
            color: var(--text-on-row);
        }
        table.dataTable tbody tr td:first-child { border-radius: 15px 0 0 15px !important; }
        table.dataTable tbody tr td:last-child { border-radius: 0 15px 15px 0 !important; }
        table.dataTable tbody tr:hover {
            background-color: var(--bg-input) !important;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        table.dataTable thead .sorting,
        table.dataTable thead .sorting_asc,
        table.dataTable thead .sorting_desc {
            background-image: none !important;
            position: relative;
        }
        table.dataTable thead .sorting:after { content: '\f0dc'; font-family: 'Font Awesome 6 Free'; font-weight: 900; position: absolute; right: 5px; opacity: 0.1; }
        table.dataTable thead .sorting_asc:after { content: '\f0de'; font-family: 'Font Awesome 6 Free'; font-weight: 900; position: absolute; right: 5px; color: #C6FF00; opacity: 1; }
        table.dataTable thead .sorting_desc:after { content: '\f0dd'; font-family: 'Font Awesome 6 Free'; font-weight: 900; position: absolute; right: 5px; color: #C6FF00; opacity: 1; }

        .dataTables_wrapper .dataTables_info {
            color: #444 !important;
            font-size: 12px !important;
            margin-top: 20px;
        }
        .dataTables_wrapper .dataTables_paginate { margin-top: 20px; }
        .dataTables_wrapper .dataTables_paginate .paginate_button {
            border-radius: 10px !important;
            border: 1px solid var(--border-main) !important;
            background: var(--bg-row) !important;
            color: var(--text-muted) !important;
            padding: 8px 15px !important;
            margin: 0 5px !important;
            transition: all 0.2s ease;
        }
        .dataTables_wrapper .dataTables_paginate .paginate_button.current {
            background: #C6FF00 !important;
            color: black !important;
            border-color: #C6FF00 !important;
            font-weight: bold;
        }
        .dataTables_wrapper .dataTables_paginate .paginate_button:hover:not(.current) {
            background: var(--bg-input) !important;
            color: var(--text-main) !important;
            border-color: var(--border-main) !important;
        }

        .tag-lime { background: rgba(198, 255, 0, 0.15); color: #C6FF00; }
        .tag-muted { background: rgba(255,255,255,0.06); color: #888; }
        .tag-amber { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }
        .swal2-html-container .form-input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            border-radius: 10px;
            padding: 10px 12px;
            margin-top: 4px;
        }
    </style>
</head>

<body class="min-h-screen flex">

    <div id="sidebar-container"></div>

    <main class="flex-1 p-8 overflow-y-auto">
        <div id="header-container"></div>

        <div class="flex justify-between items-center mb-6 flex-wrap gap-4">
            <div>
                <h3 class="text-xl font-bold">Exercise categories</h3>
                <p class="text-sm text-[var(--text-muted)] mt-1">Slugs power API filters (<code class="text-xs">?category=slug</code>) and the exercise form dropdown.</p>
            </div>
            <button type="button" id="btnAddCategory"
                class="bg-gradient-to-r from-primary to-secondary hover:opacity-90 text-black font-extrabold py-2 px-6 rounded-lg transition-all shadow-[0_0_20px_rgba(198,255,0,0.3)]">
                <i class="fas fa-plus mr-2"></i> Add category
            </button>
        </div>

        <div class="mt-4">
            <table id="catTable" class="w-full text-left">
                <thead>
                    <tr>
                        <th>Order</th>
                        <th>Slug</th>
                        <th>Display name</th>
                        <th>Description</th>
                        <th>Active</th>
                        <th>Locked</th>
                        <th class="text-right">Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </main>
        <!-- Layout Script -->
    <script>
    (function (g) {
        var p = g.location.pathname, i = p.indexOf('/admin'), b = i >= 0 ? p.slice(0, i) : '';
        try { if (b) g.sessionStorage.setItem('repvioAppBase', b); else g.sessionStorage.removeItem('repvioAppBase'); } catch (e) {}
        g.__APP_BASE_PATH__ = b;
        document.write('<script src="' + b + '/js/admin-paths.js"><\/script><script src="' + b + '/js/layout.js"><\/script>');
    })(window);
    </script>

    <script>
        let dataTable;

        const authHeaders = () => ({
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + (localStorage.getItem('adminToken') || '')
        });

        function escapeHtml(s) {
            if (s == null || s === '') return '—';
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function preview(s, max) {
            const t = s == null ? '' : String(s);
            if (t.length <= max) return escapeHtml(t);
            return escapeHtml(t.slice(0, max)) + '…';
        }

        function activeTag(on) {
            if (on !== false && on !== 'false' && on !== 0) {
                return '<span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase tag-lime">Active</span>';
            }
            return '<span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase tag-muted">Inactive</span>';
        }

        function lockedTag(on) {
            if (on === true || on === 'true' || on === 1) {
                return '<span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase tag-amber">Locked</span>';
            }
            return '<span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase tag-muted">Unlocked</span>';
        }

        function categoryFormHtml() {
            return `
                <div class="text-left space-y-3 text-sm">
                    <div>
                        <label class="text-gray-500 text-xs font-semibold">Slug</label>
                        <input id="ec-slug" type="text" class="form-input" placeholder="e.g. cardio" />
                    </div>
                    <div>
                        <label class="text-gray-500 text-xs font-semibold">Display name</label>
                        <input id="ec-display" type="text" class="form-input" placeholder="Shown in admin &amp; app" />
                    </div>
                    <div>
                        <label class="text-gray-500 text-xs font-semibold">Description (optional)</label>
                        <textarea id="ec-desc" class="form-input" rows="2" placeholder="Max 500 chars"></textarea>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-gray-500 text-xs font-semibold">Sort order</label>
                            <input id="ec-sort" type="number" class="form-input" value="0" />
                        </div>
                        <div class="flex flex-col gap-2 justify-end pb-1">
                            <label class="flex items-center gap-2 cursor-pointer text-[var(--text-main)]">
                                <input id="ec-active" type="checkbox" class="w-4 h-4 accent-primary rounded" checked />
                                <span>Active</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer text-[var(--text-main)]">
                                <input id="ec-locked" type="checkbox" class="w-4 h-4 accent-primary rounded" />
                                <span>Locked</span>
                            </label>
                        </div>
                    </div>
                    <p class="text-[10px] text-gray-500">Slug: lowercase letters, numbers, underscore; must start with a letter.</p>
                </div>
            `;
        }

        async function reloadTable() {
            if (dataTable) dataTable.ajax.reload(null, false);
        }

        document.getElementById('btnAddCategory').addEventListener('click', async () => {
            const result = await Swal.fire({
                title: 'Add category',
                html: categoryFormHtml(),
                width: 480,
                background: 'var(--bg-sidebar)',
                color: 'var(--text-main)',
                showCancelButton: true,
                confirmButtonText: 'Create',
                confirmButtonColor: '#C6FF00',
                cancelButtonColor: '#444',
                focusConfirm: false,
                didOpen: () => {
                    document.getElementById('ec-slug').value = '';
                    document.getElementById('ec-display').value = '';
                    document.getElementById('ec-desc').value = '';
                    document.getElementById('ec-sort').value = '0';
                    document.getElementById('ec-active').checked = true;
                    document.getElementById('ec-locked').checked = false;
                },
                preConfirm: () => {
                    const slug = (document.getElementById('ec-slug').value || '').trim().toLowerCase();
                    const display_name = (document.getElementById('ec-display').value || '').trim();
                    const description = (document.getElementById('ec-desc').value || '').trim() || null;
                    const sort_order = parseInt(document.getElementById('ec-sort').value, 10);
                    const is_active = document.getElementById('ec-active').checked;
                    const is_locked = document.getElementById('ec-locked').checked;
                    if (!slug) {
                        Swal.showValidationMessage('Slug is required');
                        return false;
                    }
                    if (!/^[a-z][a-z0-9_]{0,63}$/.test(slug)) {
                        Swal.showValidationMessage('Invalid slug format');
                        return false;
                    }
                    if (!display_name) {
                        Swal.showValidationMessage('Display name is required');
                        return false;
                    }
                    return { slug, display_name, description, sort_order: Number.isFinite(sort_order) ? sort_order : 0, is_active, is_locked };
                }
            });
            if (!result.isConfirmed || !result.value) return;
            try {
                const res = await fetch('/api/admin/exercise-categories', {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify(result.value)
                });
                const json = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(json.message || 'Create failed');
                await Swal.fire({ icon: 'success', title: 'Created', timer: 1600, showConfirmButton: false });
                await reloadTable();
            } catch (e) {
                Swal.fire('Error', e.message || 'Request failed', 'error');
            }
        });

        async function toggleCategoryActive(id, nextOn) {
            try {
                const res = await fetch('/api/admin/exercise-categories/' + encodeURIComponent(id), {
                    method: 'PATCH',
                    headers: authHeaders(),
                    body: JSON.stringify({ is_active: nextOn })
                });
                const json = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(json.message || 'Update failed');
                await reloadTable();
            } catch (e) {
                Swal.fire('Error', e.message || 'Request failed', 'error');
                await reloadTable();
            }
        }

        window.toggleCategoryLocked = async function toggleCategoryLocked(id, nextOn) {
            try {
                const res = await fetch('/api/admin/exercise-categories/' + encodeURIComponent(id), {
                    method: 'PATCH',
                    headers: authHeaders(),
                    body: JSON.stringify({ is_locked: nextOn })
                });
                const json = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(json.message || 'Update failed');
                await reloadTable();
            } catch (e) {
                Swal.fire('Error', e.message || 'Request failed', 'error');
                await reloadTable();
            }
        };

        function initTable() {
            if ($.fn.DataTable.isDataTable('#catTable')) {
                $('#catTable').DataTable().destroy();
            }

            dataTable = $('#catTable').DataTable({
                ajax: {
                    url: '/api/admin/exercise-categories',
                    headers: {
                        Authorization: 'Bearer ' + (localStorage.getItem('adminToken') || '')
                    },
                    dataSrc: 'data',
                    error: function (xhr) {
                        if (xhr.status === 401) {
                            window.location.href = adminUrl('/login');
                        }
                    }
                },
                columns: [
                    {
                        data: 'sort_order',
                        className: 'font-mono text-sm',
                        width: '72px'
                    },
                    {
                        data: 'slug',
                        className: 'font-mono text-sm font-semibold text-[var(--text-main)]'
                    },
                    {
                        data: 'display_name',
                        className: 'font-semibold'
                    },
                    {
                        data: 'description',
                        render: (d) => `<span class="text-sm text-muted">${preview(d, 100)}</span>`
                    },
                    {
                        data: 'is_active',
                        render: (d, t, row) => {
                            const on = d !== false && d !== 'false' && d !== 0;
                            return `
                                <div class="flex items-center gap-3">
                                    ${activeTag(d)}
                                    <label class="relative inline-flex items-center cursor-pointer">
                                        <input type="checkbox" class="sr-only peer" ${on ? 'checked' : ''}
                                            onchange="toggleCategoryActive('${row.id}', this.checked)">
                                        <div class="w-9 h-5 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-primary"></div>
                                    </label>
                                </div>`;
                        }
                    },
                    {
                        data: 'is_locked',
                        render: (d, t, row) => {
                            const on = d === true || d === 'true' || d === 1;
                            return `
                                <div class="flex items-center gap-3">
                                    ${lockedTag(d)}
                                    <label class="relative inline-flex items-center cursor-pointer">
                                        <input type="checkbox" class="sr-only peer" ${on ? 'checked' : ''}
                                            onchange="toggleCategoryLocked('${row.id}', this.checked)">
                                        <div class="w-9 h-5 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-amber-400"></div>
                                    </label>
                                </div>`;
                        }
                    },
                    {
                        data: null,
                        orderable: false,
                        searchable: false,
                        className: 'text-right',
                        render: (_, __, row) => {
                            const safeId = String(row.id || '').replace(/"/g, '');
                            const viewHref = (typeof adminUrl === 'function' ? adminUrl('/exercise-categories/view/') : '/admin/exercise-categories/view/') + encodeURIComponent(safeId);
                            const editHref = (typeof adminUrl === 'function' ? adminUrl('/exercise-categories/edit/') : '/admin/exercise-categories/edit/') + encodeURIComponent(safeId);
                            return `
                            <div class="inline-flex items-center gap-2 justify-end">
                                <a href="${viewHref}" class="inline-flex text-gray-500 hover:text-primary p-2 bg-[var(--bg-input)] rounded-lg" title="View">
                                    <i class="fas fa-eye"></i>
                                </a>
                                <a href="${editHref}" class="inline-flex text-gray-500 hover:text-secondary p-2 bg-[var(--bg-input)] rounded-lg" title="Edit">
                                    <i class="fas fa-edit"></i>
                                </a>
                            </div>`;
                        }
                    }
                ],
                order: [[0, 'asc']],
                pageLength: 12,
                language: {
                    search: '_INPUT_',
                    searchPlaceholder: 'Search categories...',
                    emptyTable: 'No categories found.'
                }
            });
        }

        $(document).ready(function () {
            initTable();
        });
    </script>
</body>

</html>
