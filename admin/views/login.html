<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to the Repvio admin panel.">
    <title>Repvio | Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link id="repvio-tailwind-css" rel="stylesheet" href="/css/tailwind-built.css">
    <link id="repvio-theme-css" rel="stylesheet" href="/css/style.css">
    <script id="repvio-theme-boot">try{document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
    <script>
(function (g) {
    function detectAppBase() {
        var path = g.location.pathname;
        var idx = path.indexOf('/admin');
        return idx >= 0 ? path.slice(0, idx) : '';
    }
    var base = detectAppBase();
    try { if (base) g.sessionStorage.setItem('repvioAppBase', base); else g.sessionStorage.removeItem('repvioAppBase'); } catch (e) {}
    g.__APP_BASE_PATH__ = base;
    g.APP_BASE_PATH = base;
    g.ADMIN_BASE = base + '/admin';
    g.adminUrl = function (path) {
        if (!path || path === '/') return g.ADMIN_BASE + '/dashboard';
        var p = path.charAt(0) === '/' ? path : '/' + path;
        if (p.indexOf('/admin') === 0) return g.APP_BASE_PATH + p;
        if (p.indexOf(g.ADMIN_BASE) === 0) return p;
        return g.ADMIN_BASE + p;
    };
    if (base && !g.__fetchApiPatched) {
        g.__fetchApiPatched = true;
        var nf = g.fetch.bind(g);
        g.fetch = function (input, init) {
            if (typeof input === 'string' && input.indexOf('/api') === 0 && input.indexOf(base) !== 0) {
                input = base + input;
            }
            return nf(input, init);
        };
        var tw = document.getElementById('repvio-tailwind-css');
        var th = document.getElementById('repvio-theme-css');
        if (tw) tw.href = base + '/css/tailwind-built.css';
        if (th) th.href = base + '/css/style.css';
    }
    try { document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
})(window);
        if (localStorage.getItem('adminToken')) {
            window.location.href = adminUrl('/dashboard');
        }
    </script>
</head>
<body class="login-page">
    <div class="login-bg login-bg--primary" aria-hidden="true"></div>
    <div class="login-bg login-bg--secondary" aria-hidden="true"></div>

    <main class="login-main">
        <div class="login-brand">
            <h1 class="login-logo">Repvio</h1>
            <p class="login-subtitle">Admin Gateway</p>
        </div>

        <div class="glass-card login-card">
            <h2 id="login-heading" class="login-title">Sign In</h2>

            <form id="loginForm" class="login-form" aria-labelledby="login-heading" novalidate>
                <div class="login-field">
                    <label class="login-field-label" for="email">Email address</label>
                    <div class="login-input-wrap">
                        <i class="fas fa-envelope login-field-icon" aria-hidden="true"></i>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                            autocomplete="username email"
                            inputmode="email"
                            spellcheck="false"
                            class="login-input"
                            placeholder="admin@repvio.ai"
                            aria-required="true">
                    </div>
                </div>

                <div class="login-field">
                    <label class="login-field-label" for="password">Password</label>
                    <div class="login-input-wrap">
                        <i class="fas fa-lock login-field-icon" aria-hidden="true"></i>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            autocomplete="current-password"
                            class="login-input"
                            placeholder="Enter your password"
                            aria-required="true">
                    </div>
                </div>

                <div class="login-options">
                    <label class="login-remember" for="rememberMe">
                        <input type="checkbox" id="rememberMe" name="remember" class="login-remember-input">
                        <span class="login-check-box" aria-hidden="true"><i class="fas fa-check" aria-hidden="true"></i></span>
                        <span class="login-remember-text">Remember me</span>
                    </label>
                </div>

                <button type="submit" id="loginBtn" class="login-submit">
                    <span>Access Dashboard</span>
                    <i class="fas fa-arrow-right login-submit-icon" aria-hidden="true"></i>
                </button>
            </form>

            <div id="errorMessage" class="login-error hidden" role="alert" aria-live="assertive" tabindex="-1">
                Invalid credentials. Please try again.
            </div>
        </div>

        <p class="login-footer">&copy; 2026 Repvio. All rights reserved.</p>
    </main>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorBox = document.getElementById('errorMessage');

            loginBtn.disabled = true;
            loginBtn.setAttribute('aria-busy', 'true');
            loginBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin" aria-hidden="true"></i> <span>Authenticating…</span>';
            errorBox.classList.add('hidden');

            try {
                const response = await fetch((window.APP_BASE_PATH || '') + '/api/admin/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (result.success) {
                    if (result.data.role !== 'admin') {
                        throw new Error('Access Denied: Admin privileges required.');
                    }
                    localStorage.setItem('adminToken', result.data.token);
                    localStorage.setItem('adminUser', JSON.stringify(result.data));
                    window.location.href = adminUrl('/dashboard');
                } else {
                    throw new Error(result.message || 'Login failed');
                }
            } catch (error) {
                errorBox.textContent = error.message;
                errorBox.classList.remove('hidden');
                loginBtn.disabled = false;
                loginBtn.removeAttribute('aria-busy');
                loginBtn.innerHTML = '<span>Access Dashboard</span> <i class="fas fa-arrow-right login-submit-icon" aria-hidden="true"></i>';
                errorBox.focus();
            }
        });
    </script>
</body>
</html>
