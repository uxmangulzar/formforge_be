<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repvio | Training modes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#C6FF00',
                        secondary: '#00E5FF',
                        tertiary: '#D9EFFF',
                        neutral: '#0A0A0A'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');
        body { font-family: 'Outfit', sans-serif; }

        .dataTables_wrapper { padding: 20px 0; }
        .dataTables_wrapper .dataTables_length,
        .dataTables_wrapper .dataTables_filter {
            display: inline-block;
            margin-bottom: 25px;
        }
        .dataTables_wrapper .dataTables_filter { float: right; }
        .dataTables_wrapper .dataTables_length select {
            background: var(--bg-input) !important;
            border: 1px solid var(--border-main) !important;
            border-radius: 8px !important;
            padding: 5px 10px !important;
            color: var(--text-main) !important;
            margin: 0 10px;
            outline: none !important;
        }
        .dataTables_wrapper .dataTables_filter input {
            background: var(--bg-input) !important;
            border: 1px solid var(--border-main) !important;
            border-radius: 10px !important;
            padding: 10px 15px !important;
            color: var(--text-main) !important;
            outline: none !important;
            width: 250px !important;
            margin-left: 15px;
        }
        .dataTables_wrapper .dataTables_filter input:focus {
            border-color: #C6FF00 !important;
            box-shadow: 0 0 15px rgba(198, 255, 0, 0.1) !important;
        }

        table.dataTable {
            border-collapse: separate !important;
            border-spacing: 0 12px !important;
            border: none !important;
            width: 100% !important;
        }
        table.dataTable thead th {
            background: transparent !important;
            border: none !important;
            color: #555 !important;
            font-size: 11px !important;
            text-transform: uppercase !important;
            letter-spacing: 1.5px !important;
            padding: 10px 20px !important;
        }
        table.dataTable tbody tr {
            background-color: var(--bg-row) !important;
            border-radius: 15px !important;
            transition: all 0.3s ease;
        }
        table.dataTable tbody tr td {
            border: none !important;
            padding: 20px !important;
            color: var(--text-on-row);
        }
        table.dataTable tbody tr td:first-child { border-radius: 15px 0 0 15px !important; }
        table.dataTable tbody tr td:last-child { border-radius: 0 15px 15px 0 !important; }
        table.dataTable tbody tr:hover {
            background-color: var(--bg-input) !important;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        table.dataTable thead .sorting,
        table.dataTable thead .sorting_asc,
        table.dataTable thead .sorting_desc {
            background-image: none !important;
            position: relative;
        }
        table.dataTable thead .sorting:after { content: '\f0dc'; font-family: 'Font Awesome 6 Free'; font-weight: 900; position: absolute; right: 5px; opacity: 0.1; }
        table.dataTable thead .sorting_asc:after { content: '\f0de'; font-family: 'Font Awesome 6 Free'; font-weight: 900; position: absolute; right: 5px; color: #C6FF00; opacity: 1; }
        table.dataTable thead .sorting_desc:after { content: '\f0dd'; font-family: 'Font Awesome 6 Free'; font-weight: 900; position: absolute; right: 5px; color: #C6FF00; opacity: 1; }

        .dataTables_wrapper .dataTables_info {
            color: #444 !important;
            font-size: 12px !important;
            margin-top: 20px;
        }
        .dataTables_wrapper .dataTables_paginate { margin-top: 20px; }
        .dataTables_wrapper .dataTables_paginate .paginate_button {
            border-radius: 10px !important;
            border: 1px solid var(--border-main) !important;
            background: var(--bg-row) !important;
            color: var(--text-muted) !important;
            padding: 8px 15px !important;
            margin: 0 5px !important;
            transition: all 0.2s ease;
        }
        .dataTables_wrapper .dataTables_paginate .paginate_button.current {
            background: #C6FF00 !important;
            color: black !important;
            border-color: #C6FF00 !important;
            font-weight: bold;
        }
        .dataTables_wrapper .dataTables_paginate .paginate_button:hover:not(.current) {
            background: var(--bg-input) !important;
            color: var(--text-main) !important;
            border-color: var(--border-main) !important;
        }

        .tag-lime { background: rgba(198, 255, 0, 0.15); color: #C6FF00; }
        .tag-muted { background: rgba(255,255,255,0.06); color: #888; }
    </style>
</head>

<body class="min-h-screen flex">

    <div id="sidebar-container"></div>

    <main class="flex-1 p-8 overflow-y-auto">
        <div id="header-container"></div>

        <div class="flex justify-between items-center mb-6 flex-wrap gap-4">
            <h3 class="text-xl font-bold">Training modes</h3>
            <a href="/training-modes/add"
                class="bg-gradient-to-r from-primary to-secondary hover:opacity-90 text-black font-extrabold py-2 px-6 rounded-lg transition-all shadow-[0_0_20px_rgba(198,255,0,0.3)]">
                <i class="fas fa-plus mr-2"></i> Add mode
            </a>
        </div>

        <div class="mt-4">
            <table id="modesTable" class="w-full text-left">
                <thead>
                    <tr>
                        <th>Order</th>
                        <th>Slug</th>
                        <th>Display name</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th class="text-right">Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </main>

    <script src="/js/layout.js"></script>
    <script>
        let dataTable;

        function escapeHtml(s) {
            if (s == null || s === '') return '—';
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function preview(s, max) {
            const t = s == null ? '' : String(s);
            if (t.length <= max) return escapeHtml(t);
            return escapeHtml(t.slice(0, max)) + '…';
        }

        function activeTag(on) {
            if (on !== false) {
                return '<span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase tag-lime">Active</span>';
            }
            return '<span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase tag-muted">Inactive</span>';
        }

        function initTable() {
            if ($.fn.DataTable.isDataTable('#modesTable')) {
                $('#modesTable').DataTable().destroy();
            }

            dataTable = $('#modesTable').DataTable({
                ajax: {
                    url: '/api/admin/training-modes',
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem('adminToken')
                    },
                    dataSrc: 'data',
                    error: function (xhr) {
                        if (xhr.status === 401) {
                            window.location.href = '/login';
                        }
                    }
                },
                columns: [
                    {
                        data: 'sort_order',
                        className: 'font-mono text-sm',
                        width: '72px'
                    },
                    {
                        data: 'slug',
                        className: 'font-mono text-sm font-semibold text-[var(--text-main)]'
                    },
                    {
                        data: 'display_name',
                        className: 'font-semibold'
                    },
                    {
                        data: 'description',
                        render: (d) => `<span class="text-sm text-muted">${preview(d, 120)}</span>`
                    },
                    {
                        data: 'is_active',
                        render: (d) => activeTag(d)
                    },
                    {
                        data: null,
                        orderable: false,
                        searchable: false,
                        className: 'text-right',
                        render: (_, __, row) => `
                            <div class="flex items-center justify-end space-x-2">
                                <a href="/training-modes/view/${row.id}" class="text-gray-500 hover:text-primary p-2 bg-[var(--bg-input)] rounded-lg" title="View"><i class="fas fa-eye"></i></a>
                                <a href="/training-modes/edit/${row.id}" class="text-gray-500 hover:text-secondary p-2 bg-[var(--bg-input)] rounded-lg" title="Edit"><i class="fas fa-edit"></i></a>
                            </div>
                        `
                    }
                ],
                order: [[0, 'asc']],
                pageLength: 10,
                language: {
                    search: '_INPUT_',
                    searchPlaceholder: 'Search modes...',
                    emptyTable: 'No modes found.'
                }
            });
        }

        $(document).ready(function () {
            initTable();
        });
    </script>
</body>

</html>
