<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repvio | User subscriptions</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');
        body { font-family: 'Outfit', sans-serif; }
        .dataTables_wrapper { padding: 20px 0; }
        .dataTables_wrapper .dataTables_length,
        .dataTables_wrapper .dataTables_filter { display: inline-block; margin-bottom: 25px; }
        .dataTables_wrapper .dataTables_filter { float: right; }
        .dataTables_wrapper .dataTables_length select,
        .dataTables_wrapper .dataTables_filter input {
            background: var(--bg-input) !important;
            border: 1px solid var(--border-main) !important;
            border-radius: 8px !important;
            padding: 5px 10px !important;
            color: var(--text-main) !important;
            outline: none !important;
        }
        .dataTables_wrapper .dataTables_filter input {
            border-radius: 10px !important;
            padding: 10px 15px !important;
            width: 260px !important;
            margin-left: 15px;
        }
        table.dataTable {
            border-collapse: separate !important;
            border-spacing: 0 12px !important;
            border: none !important;
            width: 100% !important;
        }
        table.dataTable thead th {
            background: transparent !important;
            border: none !important;
            color: #555 !important;
            font-size: 11px !important;
            text-transform: uppercase !important;
            letter-spacing: 1.5px !important;
            padding: 10px 20px !important;
        }
        table.dataTable tbody tr {
            background-color: var(--bg-row) !important;
        }
        table.dataTable tbody tr td {
            border: none !important;
            padding: 16px 20px !important;
            color: var(--text-on-row);
        }
        table.dataTable tbody tr td:first-child { border-radius: 15px 0 0 15px !important; }
        table.dataTable tbody tr td:last-child { border-radius: 0 15px 15px 0 !important; }
        table.dataTable tbody tr:hover { background-color: var(--bg-input) !important; }
        .tag-active { background: rgba(34, 197, 94, 0.15); color: #22c55e; }
        .tag-trial { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
        .tag-cancelled { background: rgba(239, 68, 68, 0.12); color: #f87171; }
        .tag-expired { background: rgba(148, 163, 184, 0.15); color: #94a3b8; }
        .tag-paused { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }
        .form-input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            border-radius: 12px;
            padding: 10px 14px;
            outline: none;
        }
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-backdrop.is-open { display: flex; }
        .modal-card {
            width: 100%;
            max-width: 480px;
            background: var(--bg-sidebar);
            border: 1px solid var(--border-main);
            border-radius: 16px;
            padding: 24px;
        }
        .modal-card--wide { max-width: 560px; }
        table.dataTable tbody tr td:last-child {
            overflow: visible !important;
            position: relative;
        }
        .sub-actions-wrap { position: relative; display: inline-block; }
        .sub-actions-trigger {
            width: 36px; height: 36px; border-radius: 10px;
            border: 1px solid var(--border-main); background: var(--bg-input);
            color: var(--text-muted); cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .sub-actions-trigger:hover,
        .sub-actions-wrap.is-open .sub-actions-trigger {
            color: var(--text-main);
            border-color: rgba(198, 255, 0, 0.45);
            background: rgba(198, 255, 0, 0.08);
        }
        .sub-actions-dropdown {
            display: none; position: absolute; right: 0; top: calc(100% + 6px);
            min-width: 200px; z-index: 1000;
            background: var(--bg-sidebar); border: 1px solid var(--border-main);
            border-radius: 12px; padding: 6px; box-shadow: 0 12px 40px rgba(0,0,0,0.35);
        }
        .sub-actions-wrap.is-open .sub-actions-dropdown { display: block; }
        .sub-menu-item {
            display: flex; align-items: center; gap: 10px; width: 100%;
            padding: 10px 12px; border: none; border-radius: 8px;
            background: transparent; color: var(--text-main);
            font-size: 13px; font-weight: 500; text-align: left; cursor: pointer;
        }
        .sub-menu-item:hover { background: var(--bg-input); }
        .sub-menu-item i { width: 16px; text-align: center; }
        .sub-menu-item--expiry i { color: #00E5FF; }
        .sub-menu-item--log i { color: #C6FF00; }
        .sub-menu-item--deactivate i { color: #fbbf24; }
        .sub-menu-item--cancel i { color: #f87171; }
        .sub-menu-item--refund i { color: #a78bfa; }
        .sub-menu-item--delete { color: #ef4444; }
        .sub-menu-divider { height: 1px; background: var(--border-main); margin: 4px 8px; }
        .sub-menu-item { text-decoration: none; }
    </style>
</head>
<body class="min-h-screen flex">

    <div id="sidebar-container"></div>

    <main class="flex-1 p-8 overflow-y-auto">
        <div id="header-container"></div>

        <div class="flex justify-between items-center mb-6 flex-wrap gap-4">
            <div>
                <h3 class="text-xl font-bold">User subscriptions</h3>
                <p class="text-sm text-gray-500 mt-1">Which user has which plan</p>
            </div>
            <button type="button" id="btnAssign" class="bg-gradient-to-r from-primary to-secondary hover:opacity-90 text-black font-extrabold py-2 px-6 rounded-lg">
                <i class="fas fa-plus mr-2"></i> Assign plan
            </button>
        </div>

        <div data-no-table-scroll>
            <table id="subsTable" class="w-full text-left" data-no-scroll-wrap="true">
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Plan</th>
                        <th>Status</th>
                        <th>Platform</th>
                        <th>Started</th>
                        <th>Expires</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </main>

    <div id="assignModal" class="modal-backdrop" aria-hidden="true">
        <div class="modal-card">
            <h4 class="text-lg font-bold mb-4">Assign subscription to user</h4>
            <form id="assignForm" class="space-y-4">
                <div>
                    <label class="text-sm text-gray-500 block mb-1">User</label>
                    <select id="assign_user_id" class="form-input" required></select>
                </div>
                <div>
                    <label class="text-sm text-gray-500 block mb-1">Plan</label>
                    <select id="assign_plan_id" class="form-input" required></select>
                </div>
                <div>
                    <label class="text-sm text-gray-500 block mb-1">Expiry date (optional)</label>
                    <input type="datetime-local" id="assign_expires_at" class="form-input" />
                </div>
                <div>
                    <label class="text-sm text-gray-500 block mb-1">Purchase token (Google Play)</label>
                    <input type="text" id="assign_purchase_token" class="form-input" placeholder="Optional — for Play refund/revoke" />
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-sm text-gray-500 block mb-1">Status</label>
                        <select id="assign_status" class="form-input">
                            <option value="active">Active</option>
                            <option value="trialing">Trialing</option>
                            <option value="paused">Paused</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-sm text-gray-500 block mb-1">Platform</label>
                        <select id="assign_platform" class="form-input">
                            <option value="admin">Admin</option>
                            <option value="manual">Manual</option>
                            <option value="google_play">Google Play</option>
                            <option value="app_store">App Store</option>
                        </select>
                    </div>
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" id="assignCancel" class="px-5 py-2 rounded-lg bg-[var(--bg-input)]">Cancel</button>
                    <button type="submit" class="px-5 py-2 rounded-lg bg-primary text-black font-bold">Save</button>
                </div>
            </form>
        </div>
    </div>

    <div id="expiryModal" class="modal-backdrop" aria-hidden="true">
        <div class="modal-card">
            <h4 class="text-lg font-bold mb-4">Update expiry date</h4>
            <form id="expiryForm" class="space-y-4">
                <input type="hidden" id="expiry_sub_id" />
                <div>
                    <label class="text-sm text-gray-500 block mb-1">Expires at</label>
                    <input type="datetime-local" id="expiry_date" class="form-input" />
                    <p class="text-xs text-gray-500 mt-1">Leave empty and save to clear expiry.</p>
                </div>
                <div class="flex justify-end gap-3">
                    <button type="button" id="expiryCancel" class="px-5 py-2 rounded-lg bg-[var(--bg-input)]">Cancel</button>
                    <button type="submit" class="px-5 py-2 rounded-lg bg-primary text-black font-bold">Save</button>
                </div>
            </form>
        </div>
    </div>
        <!-- Layout Script -->
    <script>
    (function (g) {
        var p = g.location.pathname, i = p.indexOf('/admin'), b = i >= 0 ? p.slice(0, i) : '';
        try { if (b) g.sessionStorage.setItem('repvioAppBase', b); else g.sessionStorage.removeItem('repvioAppBase'); } catch (e) {}
        g.__APP_BASE_PATH__ = b;
        document.write('<script src="' + b + '/js/admin-paths.js"><\/script><script src="' + b + '/js/layout.js"><\/script><script src="' + b + '/js/actions-menu.js"><\/script><script src="' + b + '/js/user_subscriptions.js"><\/script>');
    })(window);
    </script>

</body>
</html>
