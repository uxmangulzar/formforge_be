<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repvio | Challenge details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#C6FF00',
                        secondary: '#00E5FF',
                        tertiary: '#D9EFFF',
                        neutral: '#0A0A0A'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');
        body { font-family: 'Outfit', sans-serif; }
        .card {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-main);
            border-radius: 16px;
            padding: 1.25rem;
        }
        .ch-view-muted { color: var(--text-muted); }
        .ch-view-title { color: var(--text-main); }
    </style>
</head>

<body class="min-h-screen flex">
    <div id="sidebar-container"></div>

    <main class="flex-1 p-8 overflow-y-auto">
        <div id="header-container"></div>

        <div class="max-w-4xl mx-auto">
            <div class="flex flex-wrap justify-between items-center gap-4 mb-8">
                <div class="flex items-center space-x-4">
                    <a href="/admin/challenges" class="ch-view-muted hover:text-primary transition-all">
                        <i class="fas fa-arrow-left text-xl"></i>
                    </a>
                    <div>
                        <h2 class="text-3xl font-bold ch-view-title" id="ch-title">Challenge</h2>
                        <p class="ch-view-muted" id="ch-sub">Loading…</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <a id="btn-edit" href="#" class="px-4 py-2 rounded-lg bg-[var(--bg-input)] border border-[var(--border-main)] text-sm font-semibold ch-view-title hover:border-primary">
                        <i class="fas fa-edit mr-1"></i> Edit
                    </a>
                </div>
            </div>

            <div id="content" class="space-y-6 ch-view-title">Loading…</div>
        </div>
    </main>

    <script>
    (function (g) {
        var p = g.location.pathname, i = p.indexOf('/admin'), b = i >= 0 ? p.slice(0, i) : '';
        try { if (b) g.sessionStorage.setItem('repvioAppBase', b); else g.sessionStorage.removeItem('repvioAppBase'); } catch (e) {}
        g.__APP_BASE_PATH__ = b;
        document.write('<script src="' + b + '/js/admin-paths.js"><\/script><script src="' + b + '/js/layout.js"><\/script>');
    })(window);
    </script>

    <script>
        function escapeHtml(s) {
            if (s == null || s === '') return '';
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function challengeIdFromPath() {
            const m = window.location.pathname.match(/\/challenges\/view\/([^/?#]+)/);
            return m ? decodeURIComponent(m[1]) : '';
        }

        const CHALLENGE_ID = challengeIdFromPath();

        function showLoadError(message) {
            const msg = message || 'Failed to load challenge';
            document.getElementById('ch-sub').textContent = msg;
            document.getElementById('content').innerHTML =
                '<p class="text-red-400">' + escapeHtml(msg) + '</p>';
        }

        function apiFetch(path, init) {
            const url = typeof apiUrl === 'function' ? apiUrl(path) : path;
            return fetch(url, init);
        }

        function adminLink(path) {
            return typeof adminUrl === 'function' ? adminUrl(path) : path;
        }

        function fmt(d) {
            if (!d) return '—';
            return new Date(d).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
        }

        function statusTag(status) {
            const map = { draft: 'bg-gray-500/20 text-gray-400', published: 'bg-primary/15 text-primary', archived: 'bg-secondary/15 text-secondary' };
            const cls = map[status] || map.draft;
            return '<span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase ' + cls + '">' + escapeHtml(status) + '</span>';
        }

        function parseTriggerConfig(raw) {
            if (raw == null) return {};
            if (typeof raw === 'string') {
                try { return JSON.parse(raw); } catch { return {}; }
            }
            return typeof raw === 'object' ? raw : {};
        }

        function formatBadgeTrigger(rule) {
            const t = (rule && rule.trigger_type) ? String(rule.trigger_type) : '';
            const cfg = parseTriggerConfig(rule && rule.trigger_config);
            switch (t) {
                case 'points_threshold': {
                    const mp = cfg.min_points != null ? Number(cfg.min_points) : null;
                    if (mp != null && !Number.isNaN(mp)) return 'Points: at least ' + mp + ' pts';
                    return 'Points threshold';
                }
                case 'challenge_complete':
                    return 'When the challenge is completed';
                case 'challenge_all_stages':
                    return 'When all stages are completed';
                case 'custom':
                    return 'Custom rule';
                default:
                    return t ? t.replace(/_/g, ' ') : '—';
            }
        }

        function displayUserName(uc) {
            const u = uc && uc.user;
            if (!u) return '—';
            const fn = u.profile && u.profile.full_name ? String(u.profile.full_name).trim() : '';
            if (fn) return fn;
            return u.email || u.id || '—';
        }

        function parseChallengeMediaUrls(val) {
            if (val == null) return [];
            if (Array.isArray(val)) return val.filter((x) => typeof x === 'string');
            if (typeof val === 'string') {
                try {
                    const p = JSON.parse(val);
                    return Array.isArray(p) ? p.filter((x) => typeof x === 'string') : [];
                } catch { return []; }
            }
            return [];
        }

        async function loadChallengeView() {
            if (!CHALLENGE_ID) {
                showLoadError('Invalid challenge link');
                return;
            }
            const token = localStorage.getItem('adminToken');
            if (!token) {
                window.location.href = adminLink('/login');
                return;
            }
            try {
                const res = await apiFetch('/api/admin/challenges/' + encodeURIComponent(CHALLENGE_ID), {
                    headers: { Authorization: 'Bearer ' + token }
                });
                const json = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(json.message || 'Challenge not found');
                const ch = json.data;
                if (!ch || typeof ch !== 'object' || Array.isArray(ch)) {
                    throw new Error('Invalid challenge response');
                }

                document.getElementById('ch-title').textContent = ch.name || 'Challenge';
                document.getElementById('ch-sub').textContent = fmt(ch.starts_at) + ' → ' + fmt(ch.ends_at);
                document.getElementById('btn-edit').href = adminLink('/challenges/edit/') + ch.id;

                const stages = [...(ch.stages || [])].sort((a, b) => (a.stage_order || 0) - (b.stage_order || 0));
                let html = '<div class="card space-y-2 ch-view-title">' +
                    '<div class="flex flex-wrap gap-3 items-center">' +
                    statusTag(ch.status) +
                    '<span class="text-sm ch-view-muted">' + stages.length + ' stage(s)</span>' +
                    '</div>' +
                    (ch.description ? '<p class="text-sm ch-view-muted whitespace-pre-wrap leading-relaxed">' + escapeHtml(ch.description) + '</p>' : '') +
                    '</div>';

                const imageUrls = parseChallengeMediaUrls(ch.image_urls);
                const videoUrls = parseChallengeMediaUrls(ch.video_urls);
                if (imageUrls.length || videoUrls.length) {
                    html += '<div class="card ch-view-title space-y-4"><h3 class="text-lg font-bold ch-view-title"><i class="fas fa-photo-video text-primary mr-2"></i>Media</h3>';
                    if (imageUrls.length) {
                        html += '<div><p class="text-xs uppercase ch-view-muted mb-2">Images</p><div class="grid grid-cols-2 sm:grid-cols-3 gap-3">';
                        imageUrls.forEach((u) => {
                            html += '<a href="' + escapeHtml(u) + '" target="_blank" rel="noopener" class="block rounded-lg overflow-hidden border border-[var(--border-main)]">' +
                                '<img src="' + escapeHtml(u) + '" alt="" class="w-full h-36 object-cover hover:opacity-90 transition-opacity" loading="lazy">' +
                                '</a>';
                        });
                        html += '</div></div>';
                    }
                    if (videoUrls.length) {
                        html += '<div><p class="text-xs uppercase ch-view-muted mb-2">Videos</p><div class="space-y-3">';
                        videoUrls.forEach((u) => {
                            html += '<video controls class="w-full max-w-2xl rounded-lg border border-[var(--border-main)] bg-black" src="' + escapeHtml(u) + '">Your browser does not support video.</video>';
                        });
                        html += '</div></div>';
                    }
                    html += '</div>';
                }

                stages.forEach((st, i) => {
                    const exs = [...(st.stageExercises || [])].sort((a, b) => (a.sequence_order || 0) - (b.sequence_order || 0));
                    html += '<div class="card ch-view-title">' +
                        '<h3 class="text-lg font-bold ch-view-title mb-2"><span class="text-primary mr-2">' + (i + 1) + '.</span>' + escapeHtml(st.title) + '</h3>' +
                        (st.description ? '<p class="text-sm ch-view-muted mb-3 leading-relaxed">' + escapeHtml(st.description) + '</p>' : '') +
                        '<p class="text-xs ch-view-muted mb-2">Bonus points: <span class="font-mono font-semibold ch-view-title">' + (st.points_bonus ?? 0) + '</span></p>' +
                        '<div class="overflow-x-auto"><table class="w-full text-sm text-left">' +
                        '<thead><tr class="text-[10px] uppercase ch-view-muted border-b border-[var(--border-main)]">' +
                        '<th class="py-2 pr-2">Exercise</th><th class="py-2 pr-2">Sets</th><th class="py-2 pr-2">Reps</th><th class="py-2 pr-2">Points</th><th class="py-2">Opt.</th>' +
                        '</tr></thead><tbody>';
                    if (!exs.length) {
                        html += '<tr><td colspan="5" class="py-3 ch-view-muted">No exercises in this stage.</td></tr>';
                    } else {
                        exs.forEach((se) => {
                            const name = se.exercise ? se.exercise.name : se.exercise_id;
                            html += '<tr class="border-b border-[var(--border-main)]">' +
                                '<td class="py-2 pr-2 font-medium ch-view-title">' + escapeHtml(String(name)) + '</td>' +
                                '<td class="py-2 pr-2 font-mono">' + escapeHtml(String(se.target_sets)) + '</td>' +
                                '<td class="py-2 pr-2 font-mono">' + escapeHtml(String(se.target_reps)) + '</td>' +
                                '<td class="py-2 pr-2 font-mono">' + escapeHtml(String(se.points_on_complete)) + '</td>' +
                                '<td class="py-2 ch-view-muted">' + (se.optional ? 'Yes' : '—') + '</td>' +
                                '</tr>';
                        });
                    }
                    html += '</tbody></table></div></div>';
                });

                const badges = [...(ch.challengeBadges || [])];
                if (badges.length) {
                    html += '<div class="card ch-view-title"><h3 class="text-lg font-bold ch-view-title mb-3"><i class="fas fa-medal text-primary mr-2"></i>Badges (this challenge)</h3><ul class="space-y-2 text-sm">';
                    badges.forEach((b) => {
                        const r = (b.rules && b.rules[0]) || {};
                        const inactive = b.is_active === false ? ' <span class="ch-view-muted">(inactive)</span>' : '';
                        const triggerLine = formatBadgeTrigger(r);
                        html += '<li class="border border-[var(--border-main)] rounded-lg p-3 flex flex-col sm:flex-row sm:flex-wrap sm:justify-between sm:items-center gap-2">' +
                            '<div><span class="font-semibold ch-view-title">' + escapeHtml(b.name) + inactive + '</span>' +
                            (b.rarity ? '<span class="ml-2 text-xs uppercase ch-view-muted">' + escapeHtml(b.rarity) + '</span>' : '') +
                            '</div><div class="text-sm ch-view-muted max-w-md text-right sm:text-right">' + escapeHtml(triggerLine) + '</div></li>';
                    });
                    html += '</ul></div>';
                }

                const participants = [...(ch.userChallenges || [])];
                html += '<div class="card ch-view-title">' +
                    '<h3 class="text-lg font-bold ch-view-title mb-1"><i class="fas fa-users text-primary mr-2"></i>Participants</h3>' +
                    '<p class="text-xs ch-view-muted mb-3">' + participants.length + ' user(s) joined this challenge.</p>';
                if (!participants.length) {
                    html += '<p class="text-sm ch-view-muted">No one has joined yet.</p></div>';
                } else {
                    html += '<div class="overflow-x-auto"><table class="w-full text-sm text-left">' +
                        '<thead><tr class="text-[10px] uppercase ch-view-muted border-b border-[var(--border-main)]">' +
                        '<th class="py-2 pr-2">User</th><th class="py-2 pr-2">Email</th><th class="py-2 pr-2">Status</th><th class="py-2 pr-2">Points</th><th class="py-2">Joined</th>' +
                        '</tr></thead><tbody>';
                    participants.forEach((uc) => {
                        const u = uc.user;
                        const email = u && u.email ? escapeHtml(u.email) : '—';
                        html += '<tr class="border-b border-[var(--border-main)]">' +
                            '<td class="py-2 pr-2 font-medium ch-view-title">' + escapeHtml(displayUserName(uc)) + '</td>' +
                            '<td class="py-2 pr-2 ch-view-muted">' + email + '</td>' +
                            '<td class="py-2 pr-2"><span class="text-xs font-semibold uppercase ch-view-muted">' + escapeHtml(uc.status || '—') + '</span></td>' +
                            '<td class="py-2 pr-2 font-mono">' + (uc.total_points_earned ?? 0) + '</td>' +
                            '<td class="py-2 ch-view-muted whitespace-nowrap">' + fmt(uc.joined_at) + '</td>' +
                            '</tr>';
                    });
                    html += '</tbody></table></div></div>';
                }

                document.getElementById('content').innerHTML = html;
            } catch (e) {
                showLoadError(e.message || 'Failed to load challenge');
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadChallengeView);
        } else {
            loadChallengeView();
        }
    </script>
</body>

</html>
