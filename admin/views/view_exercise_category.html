<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repvio | Exercise category</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');
        body { font-family: 'Outfit', sans-serif; }
        .card {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-main);
            border-radius: 16px;
            padding: 1.25rem;
        }
        .cat-view-title { color: var(--text-main); }
        .cat-view-muted { color: var(--text-muted); }
        .cat-view-table {
            width: 100%;
            font-size: 0.875rem;
            text-align: left;
        }
        .cat-view-table thead tr {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-main);
        }
        .cat-view-table th { padding: 0.5rem 0.75rem 0.5rem 0; font-weight: 600; }
        .cat-view-table tbody tr { border-bottom: 1px solid var(--border-main); }
        .cat-view-table td { padding: 0.75rem 0.75rem 0.75rem 0; color: var(--text-muted); }
        .cat-view-table td.col-name { color: var(--text-main); font-weight: 600; }
    </style>
</head>

<body class="min-h-screen flex">
    <div id="sidebar-container"></div>

    <main class="flex-1 p-8 overflow-y-auto">
        <div id="header-container"></div>

        <div class="max-w-5xl mx-auto">
            <div class="flex flex-wrap justify-between items-center gap-4 mb-8">
                <div class="flex items-center space-x-4">
                    <a href="/admin/exercise-categories" class="cat-view-muted hover:text-primary transition-all">
                        <i class="fas fa-arrow-left text-xl"></i>
                    </a>
                    <div>
                        <h2 class="text-3xl font-bold cat-view-title" id="cat-title">Exercise category</h2>
                        <p class="cat-view-muted text-sm font-mono" id="cat-slug">…</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <a id="btn-edit" href="#" class="px-4 py-2 rounded-lg bg-[var(--bg-input)] border border-[var(--border-main)] text-sm font-semibold cat-view-title hover:border-primary">
                        <i class="fas fa-edit mr-1"></i> Edit
                    </a>
                </div>
            </div>

            <div id="content" class="space-y-6 cat-view-title">Loading…</div>
        </div>
    </main>

    <script>
    (function (g) {
        var p = g.location.pathname, i = p.indexOf('/admin'), b = i >= 0 ? p.slice(0, i) : '';
        try { if (b) g.sessionStorage.setItem('repvioAppBase', b); else g.sessionStorage.removeItem('repvioAppBase'); } catch (e) {}
        g.__APP_BASE_PATH__ = b;
        document.write('<script src="' + b + '/js/admin-paths.js"><\/script><script src="' + b + '/js/layout.js"><\/script>');
    })(window);
    </script>

    <script>
        const CATEGORY_ID = window.location.pathname.split('/').pop();

        function escapeHtml(s) {
            if (s == null) return '';
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        (async function () {
            const box = document.getElementById('content');
            try {
                const catRes = await fetch('/api/admin/exercise-categories/' + encodeURIComponent(CATEGORY_ID), {
                    headers: { Authorization: 'Bearer ' + (localStorage.getItem('adminToken') || '') }
                });
                const catJson = await catRes.json().catch(() => ({}));
                if (!catRes.ok) throw new Error(catJson.message || 'Category not found');
                const c = catJson.data;

                document.getElementById('cat-title').textContent = c.display_name || 'Category';
                document.getElementById('cat-slug').textContent = c.slug || '';
                document.getElementById('btn-edit').href = adminUrl('/exercise-categories/edit/') + CATEGORY_ID;

                const active = c.is_active !== false && c.is_active !== 'false' && c.is_active !== 0;
                const locked = c.is_locked === true || c.is_locked === 'true' || c.is_locked === 1;
                const badge = active
                    ? '<span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase bg-emerald-500/15 text-emerald-400">Active</span>'
                    : '<span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase bg-gray-500/20 text-gray-400">Inactive</span>';
                const lockBadge = locked
                    ? '<span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase bg-amber-500/15 text-amber-400">Locked</span>'
                    : '<span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase bg-gray-500/20 text-gray-400">Unlocked</span>';

                const exRes = await fetch('/api/exercises?category=' + encodeURIComponent(c.slug), {
                    headers: { Authorization: 'Bearer ' + (localStorage.getItem('adminToken') || '') }
                });
                const exJson = await exRes.json().catch(() => ({}));
                const exercises = Array.isArray(exJson.data) ? exJson.data : [];

                let exHtml = '';
                if (!exercises.length) {
                    exHtml = '<p class="text-sm cat-view-muted py-2">No exercises in this category yet.</p>';
                } else {
                    exHtml = `<div class="overflow-x-auto"><table class="cat-view-table">
                        <thead><tr>
                            <th>Name</th><th>Type</th><th>Difficulty</th><th>Status</th><th>Lock</th>
                        </tr></thead><tbody>`;
                    exercises.forEach((ex) => {
                        const exActive = ex.is_active !== false;
                        const locked = ex.is_locked === true || ex.is_locked === 'true' || ex.is_locked === 1;
                        const status = exActive
                            ? '<span class="text-emerald-400 text-xs font-semibold">Active</span>'
                            : '<span class="text-gray-500 text-xs font-semibold">Inactive</span>';
                        const lockCell = locked
                            ? '<span class="text-amber-400 text-xs font-semibold"><i class="fas fa-lock mr-1"></i>Locked</span>'
                            : '<span class="text-gray-500 text-xs">Unlocked</span>';
                        exHtml += `<tr>
                            <td class="col-name">${escapeHtml(ex.name)}</td>
                            <td>${escapeHtml(ex.type || '—')}</td>
                            <td>${escapeHtml(ex.difficulty || '—')}</td>
                            <td>${status}</td>
                            <td>${lockCell}</td>
                        </tr>`;
                    });
                    exHtml += '</tbody></table></div>';
                }

                box.innerHTML = `
                    <div class="card space-y-3 cat-view-title">
                        <div class="flex flex-wrap gap-3 items-center">
                            ${badge}
                            ${lockBadge}
                            <span class="text-sm cat-view-muted">Sort order: <span class="font-mono font-semibold cat-view-title">${c.sort_order ?? 0}</span></span>
                        </div>
                        ${c.description ? '<div><span class="text-xs uppercase cat-view-muted">Description</span><p class="text-sm cat-view-title whitespace-pre-wrap mt-1 leading-relaxed opacity-90">' + escapeHtml(c.description) + '</p></div>' : '<p class="text-sm cat-view-muted">No description</p>'}
                    </div>
                    <div class="card cat-view-title">
                        <div class="flex flex-wrap justify-between items-center gap-3 mb-3">
                            <h3 class="text-lg font-bold cat-view-title"><i class="fas fa-dumbbell text-primary mr-2"></i>Exercises in this category</h3>
                            <span class="text-sm cat-view-muted">${exercises.length} total</span>
                        </div>
                        ${exHtml}
                    </div>
                `;
            } catch (e) {
                box.innerHTML = '<p class="text-red-400">' + escapeHtml(e.message) + '</p>';
            }
        })();
    </script>
</body>

</html>
